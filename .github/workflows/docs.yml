name: Docs Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check links in markdown files
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress --exclude 'fonts.gstatic.com' --exclude 'localhost' '**/*.md'
          fail: true

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Spell Check
        uses: streetsidesoftware/cspell-action@v2
        with:
          files: "**/*.md"
          incremental_files_only: false
          task_name: Markdown
          extra_dictionaries: .wordlist.txt

  vale-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Vale
        run: |
          VALE_VERSION="2.30.0"
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          tar -xzf vale.tar.gz
          sudo mv vale /usr/local/bin/vale
          vale --version

      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          files: all
          vale_flags: "--config=.vale.ini"
          reporter: github-check
          fail_on_error: false
          filter_mode: nofilter
